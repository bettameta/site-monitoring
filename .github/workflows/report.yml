name: Monthly Report
on:
  schedule:
    - cron: '0 16 28-31 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Generate and send report
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: node report.js
      - name: Commit report file
        run: |
          git config --global user.email "monitor@yourdomain.com"
          git config --global user.name "Site Monitor Bot"
          git add report-*.xlsx
          git diff --staged --quiet || git commit -m "Add monthly report"
          git push
