name: Site Monitor
on:
  repository_dispatch:
    types: [monitor]
  workflow_dispatch:
concurrency:
  group: site-monitor
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Run monitor
        env:
          SLACK_WEBHOOK_STATUS: ${{ secrets.SLACK_WEBHOOK_STATUS }}
          SLACK_WEBHOOK_SSL: ${{ secrets.SLACK_WEBHOOK_SSL }}
          SLACK_WEBHOOK_SMTP: ${{ secrets.SLACK_WEBHOOK_SMTP }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: node monitor.js
      - name: Commit log file
        run: |
          git config --global user.email "monitor@yourdomain.com"
          git config --global user.name "Site Monitor Bot"
          git add log-*.json
          git diff --staged --quiet || git commit -m "Update monthly log"
          git push
